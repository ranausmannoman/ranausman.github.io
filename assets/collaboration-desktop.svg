<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" class="collaboration-svg collaboration-desktop" role="img" aria-labelledby="collab-desktop-title collab-desktop-desc">
<title id="collab-desktop-title">How I work with Claude Code and Codex</title>
<desc id="collab-desktop-desc">I set the project brief. Claude Code supervises the work and delegates implementation to Codex. Code and behavior are reviewed and tested. Revisions return to Claude Code before I validate the result and make the final release decision.</desc>
