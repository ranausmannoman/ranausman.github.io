<title id="collab-mobile-title">How I work with Claude Code and Codex</title>
<desc id="collab-mobile-desc">I set the project brief. Claude Code supervises the work and delegates implementation to Codex. Code and behavior are reviewed and tested. Revisions return to Claude Code before I validate the result and make the final release decision.</desc>
