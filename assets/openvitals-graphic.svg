<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" fill="none">
  <title>OpenVitals: from everyday cameras to a pulse signal</title>
  <desc>A conceptual face region connects to an illustrative pulse waveform, a shared native engine, and five platform targets. The waveform is synthetic, not a measurement.</desc>
  <defs>
    <linearGradient id="ov-bg" x1="0" y1="0" x2="720" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#17362f"/><stop offset="1" stop-color="#101e1c"/></linearGradient>
    <linearGradient id="ov-signal" x1="338" y1="208" x2="668" y2="208" gradientUnits="userSpaceOnUse"><stop stop-color="#6bd8c1" stop-opacity=".3"/><stop offset=".45" stop-color="#9bf4d9"/><stop offset="1" stop-color="#6bd8c1" stop-opacity=".45"/></linearGradient>
    <radialGradient id="ov-halo"><stop stop-color="#74cfa7" stop-opacity=".16"/><stop offset="1" stop-color="#74cfa7" stop-opacity="0"/></radialGradient>
  </defs>
